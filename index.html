<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RutaTruck - Rotas de Carga</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  
  <!-- Leaflet CSS & JS (Substitui a biblioteca da HERE) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

  <div class="sidebar">
    <h2>🚚 RutaTruck - Rota Segura</h2>
    
    <form id="truck-form">
      <h3>1. Dados do Veículo</h3>
      <div class="form-group">
        <label>Altura (m):</label>
        <input type="number" id="height" step="0.1" value="4.2" required>
      </div>
      <div class="form-group">
        <label>Largura (m):</label>
        <input type="number" id="width" step="0.1" value="2.6" required>
      </div>
      <div class="form-group">
        <label>Peso Bruto Total (t):</label>
        <input type="number" id="weight" step="0.5" value="45.0" required>
      </div>

      <h3>2. Trajeto (Longitude, Latitude)</h3>
      <div class="form-group">
        <label>Origem (Lng, Lat):</label>
        <input type="text" id="origin" value="-46.6333,-23.5505" placeholder="Ex: -46.6333,-23.5505" required>
      </div>
      <div class="form-group">
        <label>Destino (Lng, Lat):</label>
        <input type="text" id="destination" value="-43.1729,-22.9068" placeholder="Ex: -43.1729,-22.9068" required>
      </div>

      <button type="submit" id="btn-calculate">Calcular Rota Segura</button>
    </form>

    <div id="route-info" class="card hidden">
      <h3>Detalhes da Viagem</h3>
      <p><strong>Distância:</strong> <span id="dist-val">-</span> km</p>
      <p><strong>Tempo Estimado:</strong> <span id="time-val">-</span> min</p>
    </div>
  </div>

  <div id="map"></div>

  <script src="app.js"></script>
</body>
</html>
