<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RotaTruck - Diagnóstico e Desvio de Rotas</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

  <div class="sidebar">
    <h2>🚚 RotaTruck - Diagnóstico</h2>
    
    <form id="truck-form" autocomplete="off">
      <h3>1. Dimensões do Veículo</h3>
      <div class="form-group">
        <label>Altura (m):</label>
        <input type="number" id="height" step="0.1" value="4.2" required>
      </div>
      <div class="form-group">
        <label>Largura (m):</label>
        <input type="number" id="width" step="0.1" value="2.6" required>
      </div>
      <div class="form-group">
        <label>Peso Bruto Total (t):</label>
        <input type="number" id="weight" step="0.5" value="45.0" required>
      </div>

      <h3>2. Trajeto</h3>
      
      <!-- Origem -->
      <div class="form-group autocomplete-container">
        <label>Origem:</label>
        <div class="input-with-btn">
          <input type="text" id="origin" placeholder="Digite uma cidade ou endereço..." required>
          <button type="button" id="btn-gps" onclick="pegarLocalizacaoGPS()">📍 GPS</button>
        </div>
        <div id="origin-suggestions" class="suggestions-list hidden"></div>
      </div>

      <!-- Destino -->
      <div class="form-group autocomplete-container">
        <label>Destino:</label>
        <input type="text" id="destination" placeholder="Digite uma cidade ou endereço..." required>
        <div id="dest-suggestions" class="suggestions-list hidden"></div>
      </div>

      <button type="submit" id="btn-calculate">Analisar Pontos de Alerta</button>
    </form>

    <!-- Card de Alertas e Diagnóstico -->
    <div id="route-info" class="card hidden">
      <h3>📊 Resumo da Viagem</h3>
      
      <div class="comparison-box fast-box">
        <h4>⚡ Rota Atual (Mais Rápida)</h4>
        <p><strong>Distância:</strong> <span id="fast-dist-val">-</span> km</p>
        <p><strong>Tempo Estimado:</strong> <span id="fast-time-val">-</span> min</p>
      </div>

      <div id="status-card" class="alert-info hidden">
        <!-- O JS preencherá dinamicamente -->
      </div>

      <!-- Botão de Ação para Rota Segura -->
      <button id="btn-apply-bypass" class="btn-bypass hidden">
        🛡️ Traçar Rota de Desvio Segura
      </button>

      <div id="safe-summary" class="comparison-box safe-box hidden">
        <h4>🔵 Rota de Desvio Aplicada</h4>
        <p><strong>Nova Distância:</strong> <span id="safe-dist-val">-</span> km</p>
        <p><strong>Novo Tempo:</strong> <span id="safe-time-val">-</span> min</p>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <script src="app.js"></script>
</body>
</html>
